name: Validate registry

# RUNNER CLASS (TIN-3914): GitHub-hosted runners are not available to this org
# — hosted jobs abort with "The job was not started because your account is
# locked due to a billing issue" before step 1 executes. This workflow runs on
# the GloriousFlywheel cache-fronted ARC pool (`tinyland-nix`), matching the
# estate convention used by greatfallstoolbus.org and GloriousFlywheel.
#
# The `tinyland-nix` runner image supplies runner-bundled Node 24 and records
# its immutable Bazelisk Nix-store path in `/etc/tinyland/ci-bazelisk-bin`.
# Validation uses those two GF-owned facts directly, with no package-manager,
# tool-bootstrap action, or GitHub Actions cache authority.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Mint Tinyland registry source token
        id: tinyland-registry-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.TINYLAND_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TINYLAND_REGISTRY_APP_KEY }}
          owner: tinyland-inc
          repositories: |-
            scheduling-bridge
            tempo-store
            tinyland-file-logger
            tinyland-publishing-hooks
            tinyland-scheduled-publishing
            tinyland-schemas
            tinyland-server-config
            tinyland-server-utils
            tinyland-tracing-middleware
          permission-contents: read
      - name: Resolve GF cache authority
        id: flywheel-setup
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0
      - name: Require GF Bazel front door
        env:
          BAZEL_CACHE_REACHABLE: ${{ steps.flywheel-setup.outputs.bazel_cache_reachable }}
        run: |-
          set -euo pipefail
          test "$BAZEL_CACHE_REACHABLE" = true
          custody_file=/etc/tinyland/ci-bazelisk-bin
          test -r "$custody_file"
          bazelisk_bin="$(tr -d '\n' < "$custody_file")"
          case "$bazelisk_bin" in
            /nix/store/????????????????????????????????-bazelisk-1.25.0/bin/bazelisk) ;;
            *) echo "::error::invalid GF Bazelisk custody path: $bazelisk_bin"; exit 65 ;;
          esac
          test -f "$bazelisk_bin"
          test ! -L "$bazelisk_bin"
          test -x "$bazelisk_bin"
          test "$(stat -c '%u:%g' "$bazelisk_bin")" = "0:0"
          test -z "$(find "$bazelisk_bin" -perm /022 -print -quit)"
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(65)'
          echo "TINYLAND_CI_BAZELISK_BIN=$bazelisk_bin" >> "$GITHUB_ENV"
      - name: Verify private source token scope
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
        run: |-
          node --input-type=module <<'NODE'
          const token = process.env.TINYLAND_REGISTRY_GITHUB_TOKEN;
          if (!token) throw new Error('registry source token is missing');

          const api = await fetch('https://api.github.com/repos/tinyland-inc/scheduling-bridge', {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
            },
          });
          if (!api.ok) throw new Error(`registry source metadata read returned ${api.status}`);

          const archive = await fetch(
            'https://api.github.com/repos/tinyland-inc/scheduling-bridge/tarball/v0.7.1',
            {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
              },
              redirect: 'manual',
            },
          );
          if (![301, 302, 303, 307, 308].includes(archive.status)) {
            throw new Error(`API tarball returned ${archive.status}; expected an authenticated redirect`);
          }
          console.log('Private scheduling-bridge metadata and API tarball redirect are readable.');
          NODE
      - name: Validate static registry contracts
        run: node scripts/validate-registry.mjs
      - name: Build isolated scheduling-kit consumer
        run: node scripts/smoke-stage1-consumer-targets.mjs --scenario=scheduling-kit-only
      - name: Build isolated tempo-store consumer
        run: node scripts/smoke-stage1-consumer-targets.mjs --scenario=tempo-store-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Build isolated scheduling-bridge consumer
        run: node scripts/smoke-stage1-consumer-targets.mjs --scenario=scheduling-bridge-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
