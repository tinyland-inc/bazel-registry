name: Validate registry

# RUNNER CLASS (TIN-3914): GitHub-hosted runners are not available to this org
# — hosted jobs abort with "The job was not started because your account is
# locked due to a billing issue" before step 1 executes. This workflow runs on
# the GloriousFlywheel cache-fronted ARC pool (`tinyland-nix`), matching the
# estate convention used by greatfallstoolbus.org and GloriousFlywheel.
#
# The `tinyland-nix` runner image (ghcr.io/tinyland-inc/actions-runner-nix)
# bakes in git, curl, jq, xz-utils, ca-certificates, Determinate Nix, and the
# runner-bundled Node 24 on PATH. It deliberately does NOT expose `npm`/`npx`
# on PATH, so the `actions/setup-node` step below is load-bearing here rather
# than merely a version pin: it is what puts `npm` on PATH for the `npm run`
# steps. There is no sudo/apt on this image; setup-node needs none (it extracts
# into the runner tool cache).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v4
      - name: Mint Tinyland registry source token
        id: tinyland-registry-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.TINYLAND_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TINYLAND_REGISTRY_APP_KEY }}
          owner: tinyland-inc
          repositories: |-
            scheduling-bridge
            tinyland-file-logger
            tinyland-publishing-hooks
            tinyland-scheduled-publishing
            tinyland-schemas
            tinyland-server-config
            tinyland-server-utils
            tinyland-tracing-middleware
          permission-contents: read
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Validate static registry contracts
        run: npm run validate
      - name: Resolve aggregate active-module graph
        run: npm run smoke:resolve
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Build Stage 1 aggregate consumer targets
        run: npm run smoke:stage1-consumer
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Build isolated scheduling-kit consumer
        run: npm run smoke:scheduling-kit-only
      - name: Build isolated scheduling-bridge consumer
        run: npm run smoke:scheduling-bridge-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
