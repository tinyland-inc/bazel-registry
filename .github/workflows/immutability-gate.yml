name: Immutability gate

# RUNNER CLASS (TIN-3914): see validate.yml. GitHub-hosted runners abort in this
# org with a billing-lock error, so this gate runs on the GloriousFlywheel
# cache-fronted ARC pool (`tinyland-nix`). The gate needs only `git`, which the
# runner image bakes in; `fetch-depth: 0` still supplies the merge-base history
# the script resolves against `origin/$GITHUB_BASE_REF`.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutability-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Reject edits to shipped module versions
        run: sh scripts/check-immutable-versions.sh
